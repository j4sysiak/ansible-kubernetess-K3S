apiVersion: apps/v1
kind: Deployment
metadata:
  name: zombie-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zombie
  template:
    metadata:
      labels:
        app: zombie
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80

          # Sprawdzaj co 5s, czy plik /tmp/healthy istnieje
          #livenessProbe:
            #exec:
              #command:
                #- cat
                #- /tmp/healthy
            #initialDelaySeconds: 5
            #periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5