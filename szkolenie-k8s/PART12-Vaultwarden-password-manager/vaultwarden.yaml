# 1. DYSK (Persistent Volume Claim)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vaultwarden-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
# 2. APLIKACJA (Deployment)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vaultwarden
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vaultwarden
  template:
    metadata:
      labels:
        app: vaultwarden
    spec:
      containers:
        - name: vaultwarden
          image: vaultwarden/server:latest
          ports:
            - containerPort: 80
          env:
            # Pozwalamy na zakładanie kont
            - name: SIGNUPS_ALLOWED
              value: "true"
            # Pobieramy token z Kubernetes Secret stworzonego w Kroku 2
            - name: ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: vaultwarden-secret
                  key: ADMIN_TOKEN
          # Montujemy dysk w miejscu, gdzie Vaultwarden trzyma bazę danych
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: vaultwarden-pvc
---
# 3. SIEĆ WEWNĘTRZNA (Service)
apiVersion: v1
kind: Service
metadata:
  name: vaultwarden-svc
spec:
  selector:
    app: vaultwarden
  ports:
    - port: 80
      targetPort: 80
---
# 4. WYJŚCIE NA ŚWIAT (Ingress z TLS)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vaultwarden-ingress
  annotations:
    # Zwiększamy limit wielkości uploadu (przydatne przy załącznikach w hasłach)
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  ingressClassName: nginx   # <--- Kluczowe dla Twojego klastra
  tls:
    - hosts:
        - passwords.local
      secretName: vaultwarden-tls  # <--- Certyfikat z Kroku 1
  rules:
    - host: passwords.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vaultwarden-svc
                port:
                  number: 80