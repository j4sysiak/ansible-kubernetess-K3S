apiVersion: v1
kind: Service
metadata:
  name: my-nodeport-service-custom-app
spec:
  type: NodePort        # <--- Zmieniamy typ na NodePort
  selector:
    app: custom-app   # <--- Celujemy w nowe Pody z inną etykietą!
  ports:
    - port: 80          # Port wirtualny serwisu
      targetPort: 80    # Port kontenera
      nodePort: 30008  # <--- WAŻNE:  Otwieramy ten konkretny port na "świecie zewnętrznym" !!!!!!