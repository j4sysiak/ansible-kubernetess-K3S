apiVersion: v1
kind: Service
metadata:
  name: my-lb-service-custom-app  # <--- Zmieniona nazwa serwisu, więc musi być inna niż poprzednia
spec:
  type: LoadBalancer    # <--- Typ: LoadBalancer
  selector:
    app: custom-app  # <--- To jest NAJWAŻNIEJSZE. Musi pasować do etykiety Podów
  ports:
    - port: 80          # <--- WAŻNE: Nasłuchuj na porcie 80
      targetPort: 80