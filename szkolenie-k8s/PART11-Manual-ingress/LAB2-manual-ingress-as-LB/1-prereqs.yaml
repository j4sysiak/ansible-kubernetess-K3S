apiVersion: v1
kind: Namespace
metadata:
  name: ingress-space
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-configuration
  namespace: ingress-space
data:
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ingress-serviceaccount
  namespace: ingress-space
---
# --- ROZSZERZONE UPRAWNIENIA (RBAC) ---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ingress-role
rules:
  # Podstawowe zasoby
  - apiGroups: ["", "networking.k8s.io"]
    resources: ["configmaps", "endpoints", "nodes", "pods", "secrets", "services", "ingresses", "ingressclasses"]
    verbs: ["get", "list", "watch"]
  # Statusy Ingressa
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses/status"]
    verbs: ["update"]
  # Eventy
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  # --- NOWE: Discovery (Kluczowe dla błędu 503!) ---
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  # --- NOWE: Leader Election (Kluczowe dla błędu w logach) ---
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ingress-role-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ingress-role
subjects:
  - kind: ServiceAccount
    name: ingress-serviceaccount
    namespace: ingress-space