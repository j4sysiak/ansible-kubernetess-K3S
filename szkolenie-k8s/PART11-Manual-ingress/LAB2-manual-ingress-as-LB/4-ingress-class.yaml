apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: nginx-manual  # <--- Taką nazwę daliśmy w argumencie deploymentu (--ingress-class=nginx-manual)
  annotations:
    ingressclass.kubernetes.io/is-default-class: "true" # Ustawiamy go jako domyślny!
spec:
  controller: k8s.io/ingress-nginx