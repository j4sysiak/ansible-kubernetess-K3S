apiVersion: v1
kind: Service
metadata:
  name: my-nodeport-service
spec:
  type: NodePort        # <--- Zmieniamy typ na NodePort
  selector:
    app: training-app   # <--- Nadal celujemy w te same Pody co wcześniej!
  ports:
    - port: 80          # Port wirtualny serwisu
      targetPort: 80    # Port kontenera
      nodePort: 30007   # <--- WAŻNE:  Otwieramy ten konkretny port na "świecie zewnętrznym" !!!!!!