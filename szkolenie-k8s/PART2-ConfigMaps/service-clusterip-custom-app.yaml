apiVersion: v1
kind: Service
metadata:
  name: my-internal-service-custom # <--- Zmieniona nazwa serwisu, więc musi być inna niż poprzednia
spec:
  type: ClusterIP       # To jest domyślny typ (dostępny tylko wewnątrz klastra)
  selector:
    app: custom-app   # <--- To jest NAJWAŻNIEJSZE. Musi pasować do etykiety Podów
  ports:
    - port: 80          # Na tym porcie serwis będzie nasłuchiwał
      targetPort: 80    # Na ten port przekaże ruch do Poda