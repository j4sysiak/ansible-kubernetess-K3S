apiVersion: v1
kind: Pod
metadata:
  name: memory-demo
spec:
  containers:
    - name: memory-demo-ctr
      image: polinux/stress
      resources:
        requests:
          memory: "50Mi"   # Proszę o minimum 50MB
        limits:
          memory: "100Mi"  # Nie pozwól mi wziąć więcej niż 100MB
      command: ["stress"]
      args: ["--vm", "1", "--vm-bytes", "150M", "--vm-hang", "1"]