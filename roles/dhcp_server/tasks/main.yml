---
- name: Build DHCP Docker image
  community.docker.docker_image:
    build:
      path: "{{ role_path }}/files"
    name: "{{ dhcp_image }}"
    source: build
  become: true

- name: Create namespace for DHCP
  community.kubernetes.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ dhcp_namespace }}"
    kubeconfig: "{{ playbook_dir }}/k3s-kubeconfig"

- name: Create ConfigMap with dhcpd.conf
  community.kubernetes.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: dhcpd-config
        namespace: "{{ dhcp_namespace }}"
      data:
        dhcpd.conf: "{{ lookup('file', role_path + '/files/dhcpd.conf') }}"
    kubeconfig: "{{ playbook_dir }}/k3s-kubeconfig"

- name: Render DaemonSet template
  ansible.builtin.template:
    src: daemonset.yaml.j2
    dest: /tmp/dhcp-daemonset.yaml

- name: Apply DHCP DaemonSet
  community.kubernetes.k8s:
    state: present
    src: /tmp/dhcp-daemonset.yaml
    kubeconfig: "{{ playbook_dir }}/k3s-kubeconfig"
