apiVersion: v1
kind: Namespace
metadata:
  name: hello-kubernetes
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-kubernetes-app_2
  namespace: hello-kubernetes
  labels:
    app: hello-kubernetes-app_2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hello-kubernetes-app_2
  template:
    metadata:
      labels:
        app: hello-kubernetes-app_2
    spec:
      containers:
        - name: nginx
          image: nginx:stable-alpine
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"