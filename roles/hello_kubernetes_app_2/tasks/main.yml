# yaml
# File: roles/hello_kubernetes_app/tasks/main.yml
- name: Apply application manifest
  command: kubectl --kubeconfig={{ kubeconfig }} apply -f {{ playbook_dir }}/roles/hello_kubernetes_app_2/files/app.yaml

- name: Wait for deployment rollout
  command: kubectl --kubeconfig={{ kubeconfig }} -n hello-kubernetes rollout status deployment/hello-kubernetes-app_2 --timeout=120s
  register: rollout
  failed_when: rollout.rc != 0 and "'successfully rolled out' not in rollout.stdout"

- name: Show pods in namespace
  command: kubectl --kubeconfig={{ kubeconfig }} -n hello-kubernetes get pods -o wide
  register: pods
  changed_when: false

- name: Show service (wide)
  command: kubectl --kubeconfig={{ kubeconfig }} -n hello-kubernetes get svc hello-kubernetes-app_2 -o wide
  register: svc
  changed_when: false

- name: Get service nodePort
  command: kubectl --kubeconfig={{ kubeconfig }} -n hello-kubernetes get svc hello-kubernetes-app_2 -o jsonpath="{.spec.ports[0].nodePort}"
  register: nodeport
  changed_when: false

- name: Get first node internal IP
  command: kubectl --kubeconfig={{ kubeconfig }} get nodes -o jsonpath="{.items[0].status.addresses[?(@.type=='InternalIP')].address}"
  register: nodeip
  changed_when: false

- name: Show access info
  debug:
    msg:
      - "Pods: {{ pods.stdout_lines }}"
      - "Service: {{ svc.stdout_lines }}"
      - "Access URL (NodePort): http://{{ nodeip.stdout }}:{{ nodeport.stdout }} (may be unreachable if k3s runs in container/WSL)"

# Optional: port-forward (do ręcznie jeśli potrzebujesz szybkiego dostępu)
# uruchom lokalnie: kubectl --kubeconfig=./k3s-kubeconfig -n hello-kubernetes port-forward svc/hello-kubernetes-app_2 8080:80

