- name: Pobierz skrypt instalacyjny K3s na maszynie kontrolnej
  ansible.builtin.get_url:
    url: https://get.k3s.io
    dest: "{{ playbook_dir }}/install-k3s.sh"
    mode: '0755'
  delegate_to: localhost
  run_once: true

- name: Kopiuj skrypt na host docelowy
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/install-k3s.sh"
    dest: /tmp/install-k3s.sh
    mode: '0755'
    remote_src: no

- name: Zainstaluj fuse-overlayfs
  ansible.builtin.apt:
    name: fuse-overlayfs
    state: present
    update_cache: yes




