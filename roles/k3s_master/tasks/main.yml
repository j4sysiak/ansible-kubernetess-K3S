# yaml
- name: Upewnij się, że katalog na hoście kontrolnym istnieje
  ansible.builtin.file:
    path: "{{ playbook_dir }}/files"
    state: directory
    mode: '0755'
  delegate_to: localhost
  run_once: true

- name: Pobierz binarkę k3s na maszynie kontrolnej
  ansible.builtin.get_url:
    url: "https://github.com/k3s-io/k3s/releases/latest/download/k3s"
    dest: "{{ playbook_dir }}/files/k3s"
    mode: '0755'
  delegate_to: localhost
  run_once: true

- name: Skopiuj binarkę k3s na host docelowy
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/files/k3s"
    dest: /usr/local/bin/k3s
    owner: root
    group: root
    mode: '0755'
  become: true





- name: Utwórz katalog konfiguracyjny K3s
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    mode: '0755'

- name: Ustaw snapshotter w `config.yaml`
  ansible.builtin.copy:
    dest: /etc/rancher/k3s/config.yaml
    mode: '0644'
    content: |
      snapshotter: fuse-overlayfs
      disable:
        - traefik

 

- name: Uruchom k3s ręcznie w tle (bez systemd)
  ansible.builtin.shell: "nohup /usr/local/bin/k3s server --write-kubeconfig-mode 644 > /var/log/k3s.log 2>&1 &"
  async: 10
  poll: 0

# ***********************************************************************


- name: Poczekaj na pojawienie się kubeconfig
  ansible.builtin.wait_for:
    path: /etc/rancher/k3s/k3s.yaml
    timeout: 180


- name: Wyświetl log K3s po niepowodzeniu
  ansible.builtin.shell: tail -n 50 /var/log/k3s.log
  register: k3s_log_output
  failed_when: false

- name: Pokaż log K3s
  ansible.builtin.debug:
    var: k3s_log_output.stdout




- name: Create .kube directory for root user
  ansible.builtin.file:
    path: /root/.kube
    state: directory
    mode: '0700'

- name: Copy kubeconfig file for root user
  ansible.builtin.copy:
    src: /etc/rancher/k3s/k3s.yaml
    dest: /root/.kube/config
    remote_src: yes
    owner: root
    mode: '0600'

- name: Fetch kubeconfig from the master node to local machine
  ansible.builtin.fetch:
    src: /etc/rancher/k3s/k3s.yaml
    dest: "{{ playbook_dir }}/k3s-kubeconfig"
    flat: yes

- name: Display a message about the kubeconfig
  ansible.builtin.debug:
    msg: "Kubeconfig for your cluster has been saved to {{ playbook_dir }}/k3s-kubeconfig. You can now use 'kubectl --kubeconfig=k3s-kubeconfig get nodes'"


# install ingress-nginx

- name: Poczekaj na gotowość API Kubernetes
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: 6443
    timeout: 120

- name: Zainstaluj Ingress NGINX Controller
  ansible.builtin.shell: |
    /usr/local/bin/k3s kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/main/deploy/static/provider/baremetal/deploy.yaml
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: ingress_install
  failed_when: ingress_install.rc != 0
  changed_when: "'created' in ingress_install.stdout or 'configured' in ingress_install.stdout"

- name: Poczekaj 30 sekund na utworzenie namespace i deployment
  ansible.builtin.pause:
    seconds: 30

- name: Sprawdź, czy pody Ingress Controller istnieją
  ansible.builtin.shell: |
    /usr/local/bin/k3s kubectl get pods -n ingress-nginx --selector=app.kubernetes.io/component=controller --no-headers 2>/dev/null | wc -l
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: ingress_pod_count
  retries: 12
  delay: 10
  until: ingress_pod_count.stdout | int > 0
  changed_when: false

- name: Poczekaj na gotowość Ingress Controller
  ansible.builtin.shell: |
    /usr/local/bin/k3s kubectl wait --namespace ingress-nginx \
      --for=condition=ready pod \
      --selector=app.kubernetes.io/component=controller \
      --timeout=300s
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: ingress_ready
  failed_when: ingress_ready.rc != 0

- name: Wyświetl status Ingress Controller
  ansible.builtin.shell: |
    /usr/local/bin/k3s kubectl get svc -n ingress-nginx
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: ingress_status
  changed_when: false

- name: Pokaż usługi Ingress
  ansible.builtin.debug:
    var: ingress_status.stdout_lines
